name: CI

on:
  push:
    branches: [main, release/*]
    tags: ['v*']
  pull_request:
    branches: [main]

jobs:
  pqc-smoke-test:
    name: PQC Smoke Test
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [22.22.3, 24.x]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'pnpm'

      - name: Install pnpm
        run: npm install -g pnpm@9

      - name: Install dependencies
        run: |
          pnpm config set --location=project node-linker hoisted
          pnpm install --no-frozen-lockfile

      - name: Build
        run: pnpm build:tsdown

      - name: Install @noble/post-quantum (tarball)
        run: |
          curl -fsSL -o /tmp/npqt.tgz https://registry.npmjs.org/@noble/post-quantum/-/post-quantum-0.5.0.tgz
          mkdir -p node_modules/@noble/post-quantum
          tar -xzf /tmp/npqt.tgz -C node_modules/@noble/post-quantum --strip-components=1
          curl -fsSL -o /tmp/curves.tgz https://registry.npmjs.org/@noble/curves/-/curves-2.0.0-beta.3.tgz
          mkdir -p node_modules/@noble/curves
          tar -xzf /tmp/curves.tgz -C node_modules/@noble/curves --strip-components=1
          curl -fsSL -o /tmp/hashes.tgz https://registry.npmjs.org/@noble/hashes/-/hashes-2.0.0-beta.5.tgz
          mkdir -p node_modules/@noble/hashes
          tar -xzf /tmp/hashes.tgz -C node_modules/@noble/hashes --strip-components=1

      - name: Run PQC smoke test
        run: |
          node --input-type=module -e "
          import { ml_dsa44 } from './node_modules/@noble/post-quantum/ml-dsa.js';
          import { ml_kem768 } from './node_modules/@noble/post-quantum/ml-kem.js';
          const d = ml_dsa44.keygen();
          const m = new TextEncoder().encode('CI test');
          const s = ml_dsa44.sign(m, d.secretKey);
          if (!ml_dsa44.verify(s, m, d.publicKey)) throw new Error('ML-DSA-44 verify failed');
          const k = ml_kem768.keygen();
          const e = ml_kem768.encapsulate(k.publicKey);
          const d2 = ml_kem768.decapsulate(e.cipherText, k.secretKey);
          if (!Buffer.from(e.sharedSecret).equals(Buffer.from(d2))) throw new Error('ML-KEM-768 ss mismatch');
          console.log('✅ PQC smoke test passed');
          "

  unit-test:
    name: Unit Test
    runs-on: ubuntu-latest
    needs: pqc-smoke-test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24.x
      - run: npm install -g pnpm@9
      - run: pnpm install --no-frozen-lockfile
      - run: pnpm test

  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24.x
      - run: npm install -g pnpm@9
      - run: pnpm install --no-frozen-lockfile
      - run: pnpm lint

  typecheck:
    name: TypeScript Type Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24.x
      - run: npm install -g pnpm@9
      - run: pnpm install --no-frozen-lockfile
      - run: pnpm exec tsc --noEmit

  cross-platform:
    name: Cross-Platform Test
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        node-version: [24.x]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
      - run: npm install -g pnpm@9
      - name: Install (macOS/Linux)
        if: runner.os != 'Windows'
        run: pnpm install --no-frozen-lockfile
      - name: Install (Windows)
        if: runner.os == 'Windows'
        run: pnpm install --no-frozen-lockfile
      - name: PQC smoke test
        run: |
          # Same as pqc-smoke-test job, abbreviated
          node -e "
          import('file:///$(pwd | sed 's|\\\\|/|g')/node_modules/@noble/post-quantum/ml-dsa.js').then(async (m) => {
            const d = m.ml_dsa44.keygen();
            const s = m.ml_dsa44.sign(new TextEncoder().encode('test'), d.secretKey);
            if (!m.ml_dsa44.verify(s, new TextEncoder().encode('test'), d.publicKey)) process.exit(1);
            console.log('OK');
          });
          "
